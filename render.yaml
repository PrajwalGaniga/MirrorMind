services:
  - type: web
    name: mirrormind-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_RAG_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_LIVE_MODEL
        value: gemini-2.5-flash-native-audio-latest
      - key: GEMINI_LIVE_FALLBACK_MODEL
        value: gemini-2.0-flash-exp
      - key: NOVA_START_SENSITIVITY
        value: LOW
      - key: NOVA_END_SENSITIVITY
        value: LOW
      - key: NOVA_SILENCE_MS
        value: "1000"
      - key: NOVA_PREFIX_PADDING_MS
        value: "200"
      - key: USE_MANUAL_VAD
        value: "false"
      - key: INTERVIEW_START_SENSITIVITY
        value: LOW
      - key: INTERVIEW_END_SENSITIVITY
        value: LOW
      - key: INTERVIEW_SILENCE_MS
        value: "1800"
      - key: INTERVIEW_PREFIX_PADDING_MS
        value: "200"
      - key: TARGET_COMPRESSION_TOKENS
        value: "4096"
      - key: GEMINI_VOICE_NAME
        value: Aoede
      - key: DEBUG_VOICE
        value: "false"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_RAG_DB
        sync: false
      - key: GEMINI_LIVE_API_KEY
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
